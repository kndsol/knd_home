name: AirCargo Manager APK

on:
  push:
    branches: [ aircargo-manager ]
    paths:
      - 'aircargo-manager/**'
      - '.github/workflows/aircargo-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aircargo-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AirCargoManager-debug-apk
          path: aircargo-manager/app/build/outputs/apk/debug/app-debug.apk

      # 결과(APK 또는 오류 로그)를 aircargo-apk 브랜치에 커밋 → git으로 회수
      - name: Publish result to apk branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/build.log || true
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/AirCargoManager-debug.apk 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/out/RESULT.txt
          cd /tmp/out
          git init -q -b aircargo-apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "Build result ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" aircargo-apk
